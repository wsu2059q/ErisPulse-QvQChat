# Ruff 最小基线配置（docs/optimization-tickets.md T17）
# 目标：保证 lint 通过、不引入新问题；存量告警的清理由后续工单（T20/T23/T24）承接。
line-length = 120
target-version = "py310"

exclude = [
    "QvQChat.bak",
    "data",
    "config",
    ".venv",
]

[lint]
# 显式固定规则集为 ruff 传统默认（E4/E7/E9/F），避免随 ruff 版本默认集扩张而漂移
select = ["E4", "E7", "E9", "F"]
# F401 未使用导入：存量 22 处（防御/条件导入、测试 fixture 透传），随 T20/T24 拆分清理
ignore = ["F401"]

[lint.per-file-ignores]
# F821：title_task 引用 ChatRequest 但未导入——已知存量缺陷（运行到即 NameError），
# 本轮源码冻结不修，暂按文件压制；修复后请移除本条
"QvQChat/conversation/service.py" = ["F821"]
# F841：测试内局部变量仅作构造/断言前置，不参与断言
"tests/*" = ["F841"]
