<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QvQChat</title>
<style>
  :root { color-scheme: dark light; }
  @media (prefers-color-scheme: light) {
    body { background: #f6f7f9; color: #1f2430; }
    .brand { color: #1177b0; }
    .brand i { color: #1f2430; }
    .meta { color: #6b7482; }
    .expired { border-color: #d5dae2; color: #6b7482; }
    .expired b { color: #1f2430; }
    .m.bot { border-left-color: #dfe4ec; }
    .m .role { color: #6b7482; }
    .m.user .role { color: rgba(255,255,255,0.8); }
    .m.ctx { border-color: #d5dae2; color: #6b7482; }
    .md code { background: rgba(100,110,125,0.14); }
    .md .pre { border-color: #dfe4ec; background: #fff; }
    .md .pre .lang { color: #6b7482; border-bottom-color: #dfe4ec; }
    .md .pre .lang .copy { border-color: #dfe4ec; color: #6b7482; }
    .md .pre .lang .copy:hover { color: #1f2430; border-color: #b7c0cc; }
    .md a { color: #1177b0; }
    .md th { background: #eef1f5; }
    .md th, .md td { border-color: #dfe4ec; }
    .md blockquote { border-left-color: #74b7e0; }
    .more { color: #6b7482; }
    .cont { border-top-color: #d5dae2; }
    .cont-title { color: #6b7482; }
    .cont-input { border-color: #dfe4ec; background: #fff; color: #1f2430; }
    .cont-send { background: #1177b0; }
    .cont-meta { color: #6b7482; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1115; color: #e8ecf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .brand { font-weight: 800; font-size: 18px; color: #74d0f5; letter-spacing: -0.01em; }
  .brand i { font-style: normal; color: #e8ecf1; }
  .meta { font-size: 12px; color: #8b96a5; }
  .expired {
    margin: 60px auto 0; max-width: 380px; text-align: center; border: 1px dashed #333a45;
    border-radius: 14px; padding: 30px 20px; color: #8b96a5;
  }
  .expired b { display: block; font-size: 15px; color: #e8ecf1; margin-bottom: 6px; }
  .msgs { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .m.user { align-self: flex-end; max-width: 60%; background: #2f93cd; color: #fff; border-radius: 14px; border-bottom-right-radius: 5px; padding: 9px 14px; white-space: pre-wrap; word-break: break-word; }
  .m.bot { align-self: stretch; border-left: 2px solid #2a323d; padding: 2px 0 2px 14px; word-break: break-word; }
  .m .role { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8b96a5; margin-bottom: 3px; text-transform: uppercase; }
  .m.user .role { text-align: right; color: rgba(255,255,255,0.75); }
  .m.ctx { border: 1px dashed #333a45; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #8b96a5; }
  .m.ctx summary { cursor: pointer; }
  .m.ctx pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: 12px; }
  .md p { margin: 0 0 6px; } .md :last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 4px 0; padding-left: 20px; }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; background: rgba(127,137,148,0.16); padding: 1px 5px; border-radius: 6px; }
  .md .pre { margin: 6px 0; border: 1px solid #2a323d; border-radius: 10px; overflow: hidden; background: #161a20; }
  .md .pre .lang { display: flex; justify-content: space-between; align-items: center; padding: 3px 10px; font-size: 11px; color: #8b96a5; border-bottom: 1px solid #2a323d; }
  .md .pre .lang .copy { border: 1px solid #2a323d; background: transparent; color: #8b96a5; font-size: 11px; border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .md .pre .lang .copy:hover { color: #e8ecf1; border-color: #4a5563; }
  .md .pre pre { margin: 0; padding: 9px 12px; overflow-x: auto; font-size: 12.5px; font-family: ui-monospace, Consolas, monospace; }
  .md a { color: #74d0f5; }
  .md table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 12.5px; }
  .md th, .md td { border: 1px solid #2a323d; padding: 5px 9px; text-align: left; }
  .md th { background: #161a20; }
  .md blockquote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid #74d0f5; opacity: 0.85; }
  .more { text-align: center; color: #8b96a5; font-size: 12px; margin-top: 10px; }
  .cont { margin-top: 26px; border-top: 1px dashed #333a45; padding-top: 16px; }
  .cont-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8b96a5; margin-bottom: 10px; text-transform: uppercase; }
  .cont .m.user { margin-top: 10px; }
  .cont-bar { display: flex; gap: 8px; margin-top: 14px; }
  .cont-input { flex: 1; border: 1px solid #2a323d; background: #161a20; color: #e8ecf1; border-radius: 10px; padding: 9px 12px; font: inherit; }
  .cont-send { border: none; background: #2f93cd; color: #fff; border-radius: 10px; padding: 9px 18px; font: inherit; cursor: pointer; }
  .cont-send:disabled { opacity: 0.6; cursor: default; }
  .cont-meta { margin-top: 8px; font-size: 12px; color: #8b96a5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">QvQ<i>Chat</i></div>
    <div class="meta" id="meta"></div>
  </div>
  <div id="content"><div class="expired" id="loading"><b></b></div></div>
</div>
<script>
(function () {
  var LANGS = {
    "zh": { title: "会话分享", loading: "加载中…", empty: "没有可显示的消息", empty_hint: "分享内容为空或超出预算。",
        summary: "上下文摘要", user: "用户", invalid: "链接无效或已过期", invalid_hint: "请向分享者索取新的链接。",
        valid_until: "有效至", budget_note: "仅显示预算内的最近消息", tool: "工具",
        copy: "复制", copied: "已复制", load_failed: "加载失败，请稍后刷新重试（链接仍有效）", continue_ph: "基于这段对话继续问…", send: "发送", you: "访问者", bot: "AI",
        rounds_left: "剩余 {n} 轮 · 额度 {t} tokens", done: "续聊轮数或额度已用完", cont_title: "继续对话" },
    "zh-tw": { title: "會話分享", loading: "載入中…", empty: "沒有可顯示的訊息", empty_hint: "分享內容為空或超出預算。",
        summary: "上下文摘要", user: "使用者", invalid: "連結無效或已過期", invalid_hint: "請向分享者索取新的連結。",
        valid_until: "有效至", budget_note: "僅顯示預算內的最近訊息", tool: "工具",
        copy: "複製", copied: "已複製", load_failed: "載入失敗，請稍後重新整理重試（連結仍有效）", continue_ph: "基於這段對話繼續問…", send: "傳送", you: "訪問者", bot: "AI",
        rounds_left: "剩餘 {n} 輪 · 額度 {t} tokens", done: "續聊輪數或額度已用完", cont_title: "繼續對話" },
    "ja": { title: "セッション共有", loading: "読み込み中…", empty: "表示できるメッセージがありません", empty_hint: "共有内容が空か、予算を超えています。",
        summary: "コンテキスト要約", user: "ユーザー", invalid: "リンクが無効または期限切れです", invalid_hint: "共有者に新しいリンクを請求してください。",
        valid_until: "有効期限", budget_note: "予算内の最近のメッセージのみ表示", tool: "ツール",
        copy: "コピー", copied: "コピーしました", load_failed: "読み込みに失敗しました。再試行してください（リンクは有効です）", continue_ph: "この会話に基づいて質問を続ける…", send: "送信", you: "訪問者", bot: "AI",
        rounds_left: "残り {n} 回 · 残 {t} tokens", done: "続きの回数または残高を使い切りました", cont_title: "会話を続ける" },
    "ru": { title: "Общая сессия", loading: "Загрузка…", empty: "Нет сообщений для показа", empty_hint: "Общее содержимое пусто или превышает лимит.",
        summary: "Сводка контекста", user: "Пользователь", invalid: "Ссылка недействительна или истекла", invalid_hint: "Попросите у отправителя новую ссылку.",
        valid_until: "действует до", budget_note: "Показаны только недавние сообщения в пределах лимита", tool: "Инструмент",
        copy: "Копировать", copied: "Скопировано", load_failed: "Не удалось загрузить — обновите страницу (ссылка действительна)", continue_ph: "Продолжить вопрос по этому диалогу…", send: "Отправить", you: "Гость", bot: "AI",
        rounds_left: "Осталось {n} раундов · {t} tokens", done: "Раунды или лимит исчерпаны", cont_title: "Продолжить диалог" },
    "en": { title: "Shared session", loading: "Loading…", empty: "Nothing to show", empty_hint: "The shared content is empty or over budget.",
        summary: "Context summary", user: "User", invalid: "Link invalid or expired", invalid_hint: "Please ask the sender for a fresh link.",
        valid_until: "valid until", budget_note: "Showing only the most recent messages within budget", tool: "Tool",
        copy: "Copy", copied: "Copied", load_failed: "Load failed — refresh to retry (the link is still valid)", continue_ph: "Ask more based on this chat…", send: "Send", you: "Visitor", bot: "AI",
        rounds_left: "{n} rounds left · {t} tokens", done: "Continuation rounds or budget used up", cont_title: "Continue this chat" }
  };
  var nav = (navigator.language || "en").toLowerCase();
  var L = LANGS[nav] || LANGS[nav.split("-")[0]] || LANGS.en;
document.title = "QvQChat · " + L.title;
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function md(src) {
    var text = String(src == null ? "" : src).replace(/\r\n/g, "\n").trim();
    if (!text) return "";
    var parts = text.split("```");
    var out = '<div class="md">';
    for (var pi = 0; pi < parts.length; pi++) {
      if (pi % 2 === 1) {
        var code = parts[pi], nl = code.indexOf("\n");
        var lang = nl >= 0 ? code.slice(0, nl).trim() : "";
        var body = nl >= 0 ? code.slice(nl + 1) : code;
        var codeText = body.replace(/\n$/, "");
        out += '<div class="pre"><div class="lang"><span>' + esc(lang || "code") + '</span><button type="button" class="copy">' + esc(L.copy) + '</button></div><pre>' + esc(codeText) + "</pre></div>";
        continue;
      }
      var lines = parts[pi].split("\n");
      var para = [], list = null, quote = [];
      var flush = function () { if (para.length) { out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
      var flushList = function () { if (list) { out += "</" + list + ">"; list = null; } };
      var flushQuote = function () { if (quote.length) { out += "<blockquote>" + quote.map(inline).join("<br>") + "</blockquote>"; quote = []; } };
      for (var li = 0; li < lines.length; li++) {
        var tline = lines[li].trim();
        if (!tline) { flush(); flushList(); flushQuote(); continue; }
        var hm = tline.match(/^(#{1,6})\s+(.*)$/);
        if (hm) { flush(); flushList(); flushQuote(); out += "<h" + hm[1].length + ">" + inline(esc(hm[2])) + "</h" + hm[1].length + ">"; continue; }
        if (/^(-{3,}|\*{3,})$/.test(tline)) { flush(); flushList(); flushQuote(); out += "<hr/>"; continue; }
        if (tline.indexOf("|") === 0 && li + 1 < lines.length && /^\|[\s:|-]+$/.test(lines[li + 1].trim())) {
          flush(); flushList(); flushQuote();
          var splitRow = function (line) {
            return line.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
          };
          var headCells = splitRow(tline);
          li += 2;
          var bodyRows = [];
          while (li < lines.length && /^\|/.test(lines[li].trim())) { bodyRows.push(splitRow(lines[li].trim())); li++; }
          li--;
          out += "<table><thead><tr>" + headCells.map(function (c) { return "<th>" + inline(esc(c)) + "</th>"; }).join("") +
            "</tr></thead><tbody>" + bodyRows.map(function (r) {
              return "<tr>" + r.map(function (c) { return "<td>" + inline(esc(c)) + "</td>"; }).join("") + "</tr>";
            }).join("") + "</tbody></table>";
          continue;
        }
        if (tline.indexOf(">") === 0) { flush(); flushList(); quote.push(esc(tline.replace(/^>\s?/, ""))); continue; }
        var ulm = tline.match(/^[-*+]\s+(.*)$/);
        var olm = tline.match(/^\d+[.)]\s+(.*)$/);
        if (ulm || olm) {
          flush(); flushQuote();
          var want = ulm ? "ul" : "ol";
          if (list !== want) { flushList(); out += "<" + want + ">"; list = want; }
          out += "<li>" + inline(esc((ulm || olm)[1])) + "</li>";
          continue;
        }
        flushList(); flushQuote();
        para.push(esc(tline));
      }
      flush(); flushList(); flushQuote();
    }
    return out + "</div>";
  }
  function inline(s) {
    return s
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function contentText(c) {
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.filter(function (p) { return p && p.type === "text"; }).map(function (p) { return p.text || ""; }).join("\n");
    return String(c || "");
  }
  function renderContinuation(box, data, token) {
    var rounds = data.rounds || 0;
    var stale = box.querySelector(".cont");
    if (stale) stale.remove();
    if (!(rounds > 0)) return;
    var wrap = document.createElement("div");
    wrap.className = "cont";
    var inner = '<div class="cont-title">' + esc(L.cont_title) + "</div>";
    (data.continuation || []).forEach(function (m) {
      if (!m || typeof m !== "object") return;
      if (m.role === "user") {
        inner += '<div class="m user"><div class="role">' + esc(L.you) + '</div>' + esc(m.content || "") + "</div>";
      } else if (m.role === "assistant") {
        inner += '<div class="m bot"><div class="role">' + esc(L.bot) + '</div><div class="md">' + md(m.content || "") + "</div></div>";
      }
    });
    if ((data.rounds_left || 0) > 0) {
      inner += '<div class="cont-bar">' +
        '<input class="cont-input" placeholder="' + esc(L.continue_ph) + '" maxlength="2000"/>' +
        '<button type="button" class="cont-send">' + esc(L.send) + "</button></div>" +
        '<div class="cont-meta">' + esc(L.rounds_left.replace("{n}", data.rounds_left).replace("{t}", data.tokens_left || 0)) + "</div>";
    } else {
      inner += '<div class="cont-meta">' + esc(L.done) + "</div>";
    }
    wrap.innerHTML = inner;
    box.appendChild(wrap);
    var send = wrap.querySelector(".cont-send");
    var input = wrap.querySelector(".cont-input");
    if (!send || !input) return;
    function go() {
      var text = input.value.trim();
      if (!text || send.disabled) return;
      send.disabled = true;
      input.disabled = true;
      fetch("/QvQChat/api/qvq/share/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, text: text })
      }).then(function (r) { return r.json(); }).then(function (out) {
        if (out && out.ok) {
          data.continuation = (data.continuation || []).concat([
            { role: "user", content: text },
            { role: "assistant", content: out.reply }
          ]);
          data.rounds_left = out.rounds_left;
          data.tokens_left = out.tokens_left;
          renderContinuation(box, data, token);
          var fresh = box.querySelector(".cont");
          if (fresh) fresh.scrollIntoView({ behavior: "smooth", block: "end" });
        } else {
          send.disabled = false;
          input.disabled = false;
          alert((out && out.error) || "error");
        }
      }).catch(function () {
        send.disabled = false;
        input.disabled = false;
      });
    }
    send.onclick = go;
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); }
    });
  }

  document.querySelector("#loading b").textContent = L.loading;
  fetch("/QvQChat/api/qvq/share/messages?token=" + encodeURIComponent("__TOKEN__"), { cache: "no-store" })
    .then(function (r) {
      if (r.status === 403) {
        document.getElementById("content").innerHTML =
          '<div class="expired"><b>' + L.invalid + '</b>' + L.invalid_hint + '</div>';
        return null;
      }
      if (!r.ok) throw new Error("bad");
      return r.json();
    })
    .then(function (data) {
      if (!data) return;
      var msgs = data.messages || [];
      var box = document.getElementById("content");
      var exp = data.expires ? new Date((data.expires || 0) * 1000) : null;
      document.getElementById("meta").textContent =
        (data.chat_key || "") + (exp ? " · " + L.valid_until + " " + exp.toLocaleString() : "");
      if (!msgs.length) {
        box.innerHTML = '<div class="expired"><b>' + L.empty + '</b>' + L.empty_hint + '</div>';
        return;
      }
      var html = "";
      if (data.summary) {
        html += '<details class="m ctx"><summary>' + L.summary + '</summary><pre>' + esc(data.summary) + "</pre></details>";
      }
      html += '<div class="msgs">';
      msgs.forEach(function (m) {
        if (!m || typeof m !== "object") return;
        var role = m.role || "user";
        var raw = contentText(m.content);
        if (role === "user") {
          html += '<div class="m user"><div class="role">' + L.user + '</div>' + esc(raw) + "</div>";
        } else if (role === "assistant") {
          html += '<div class="m bot"><div class="role">AI</div>' + (md(raw) || esc(raw)) + "</div>";
        } else {
          html += '<details class="m ctx"><summary>' + esc(role) + "</summary><pre>" + esc(raw) + "</pre></details>";
        }
      });
      html += "</div>";
      if (data.truncated) html += '<div class="more">' + L.budget_note + '</div>';
      box.innerHTML = html;
      box.querySelectorAll(".pre .copy").forEach(function (btn) {
        btn.onclick = function () {
          var pre = btn.closest(".pre").querySelector("pre");
          var done = function () { btn.textContent = L.copied; setTimeout(function () { btn.textContent = L.copy; }, 1200); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(pre.textContent).then(done);
          } else {
            var ta = document.createElement("textarea");
            ta.value = pre.textContent;
            document.body.appendChild(ta); ta.select();
            try { document.execCommand("copy"); done(); } catch (e) {}
            ta.remove();
          }
        };
      });
      renderContinuation(box, data, token);
    })
    .catch(function () {
      // 403 已在 then 内分流；走到这里的是网络/代理失败——不再误报"链接无效"
      document.getElementById("content").innerHTML =
        '<div class="expired"><b>' + (L.load_failed || L.invalid) + '</b>' + (L.load_failed ? "" : L.invalid_hint) + '</div>';
    });
})();
</script>
</body>
</html>
